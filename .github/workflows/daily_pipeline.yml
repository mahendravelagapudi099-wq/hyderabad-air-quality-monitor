name: Daily Air Quality Pipeline

on:
  schedule:
    # 07:00 IST is 01:30 UTC (UTC + 5:30) every day
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Secrets
        run: |
          MISSING_SECRETS=0
          if [ -z "${{ secrets.OPENAQ_API_KEY }}" ]; then
            echo "::error::OPENAQ_API_KEY secret is missing! Configure OPENAQ_API_KEY in repository Secrets."
            MISSING_SECRETS=1
          fi
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL secret is missing! Configure DATABASE_URL in repository Secrets."
            MISSING_SECRETS=1
          fi
          if [ $MISSING_SECRETS -ne 0 ]; then
            exit 1
          fi

      - name: Run Pipeline (Past 3 Days to PostgreSQL)
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/run_pipeline.py --days 3

      - name: Workflow Health & Keep-Alive Check
        # GitHub disables scheduled workflows on repos with no commit activity for 60 days.
        # This step verifies pipeline health and logs an explicit keep-alive heartbeat.
        run: |
          echo "============================================================"
          echo "PIPELINE HEALTH & KEEP-ALIVE HEARTBEAT"
          echo "============================================================"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          echo "Pipeline run completed successfully to production PostgreSQL."
          echo "Note: If the repository receives no commits for 60 days, GitHub"
          echo "may pause scheduled cron jobs. Trigger this workflow manually"
          echo "via workflow_dispatch or push a commit to keep scheduled runs active."
          echo "============================================================"
